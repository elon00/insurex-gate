name: Implementation Verification (Fail Closed)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install declared Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile all Python test sources
        run: python -m compileall -q tests
      - name: Execute real Python tests
        run: python -m pytest -q tests
  rust-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Rust targets
        run: cargo check --all-targets
      - name: Execute Rust tests
        run: cargo test --all-targets
